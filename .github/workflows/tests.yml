name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r server/requirements.txt numpy
      - name: Server tests
        working-directory: server
        run: pytest -q
      - name: Shared tool and contract tests
        run: python -m pytest -q tools
      - name: Data loader tests
        run: python -m pytest -q training/test_data.py training/test_evaluate.py
